<!doctype html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    RJ | North Georgia Realtor & Real Estate Investor
  </title>

  <meta
    name="description"
    content="RJ is a trusted North Georgia realtor and real estate investor helping clients buy, sell and invest in real estate."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --purple:#a855f7;
      --cyan:#22d3ee;
      --pink:#ff4fd8;
      --green:#25d366;
      --red:#ff3b30;
      --blue:#1877f2;

      --muted:rgba(255,255,255,.72);
      --border:rgba(255,255,255,.15);
    }

    body{
      min-height:100vh;

      font-family:'Inter',sans-serif;

      color:white;

      background:#050816;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:24px;

      overflow-x:hidden;

      position:relative;
    }

    /* BACKGROUND IMAGE */

    body::before{
      content:"";

      position:fixed;
      inset:0;

      background:
        linear-gradient(
          rgba(5,8,22,.68),
          rgba(5,8,22,.90)
        ),
        url("home-bg.jpg") center/cover no-repeat;

      animation:
        slowZoom 18s ease-in-out infinite alternate;

      z-index:-3;
    }

    @keyframes slowZoom{

      from{
        transform:scale(1);
      }

      to{
        transform:scale(1.08);
      }

    }

    /* MAIN CARD */

    .card{
      width:100%;
      max-width:470px;

      background:rgba(17,25,40,.62);

      border:1px solid var(--border);

      border-radius:34px;

      backdrop-filter:blur(26px);
      -webkit-backdrop-filter:blur(26px);

      box-shadow:
        0 20px 80px rgba(0,0,0,.45),
        0 0 40px rgba(168,85,247,.18);

      padding:26px 24px 34px;

      position:relative;

      overflow:hidden;
    }

    /* EMAIL + PHONE */

    .top-actions{
      width:100%;
      max-width:370px;

      margin:0 auto 28px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;

      padding:10px 14px;

      border-radius:999px;

      background:rgba(5,8,22,.72);

      border:1px solid rgba(255,255,255,.18);

      box-shadow:
        0 0 32px rgba(34,211,238,.18);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .top-btn{
      flex:1;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:10px;

      min-height:48px;

      border-radius:999px;

      text-decoration:none;

      color:white;

      font-weight:800;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
    }

    .top-btn:hover{
      transform:
        translateY(-2px)
        scale(1.02);
    }

    .email-btn{
      background:
        linear-gradient(
          135deg,
          #a855f7,
          #22d3ee
        );

      box-shadow:
        0 0 22px rgba(168,85,247,.35);
    }

    .phone-btn{
      background:
        linear-gradient(
          135deg,
          #22c55e,
          #25d366
        );

      box-shadow:
        0 0 22px rgba(37,211,102,.35);
    }

    .top-btn span{
      font-size:20px;
    }

    .top-divider{
      width:1px;
      height:32px;

      background:rgba(255,255,255,.22);
    }

    /* PROFILE */

    .profile{
      text-align:center;

      margin-bottom:30px;
    }

    .avatar{
      width:150px;
      height:150px;

      margin:0 auto 20px;

      border-radius:50%;

      padding:4px;

      background:
        linear-gradient(
          135deg,
          var(--pink),
          var(--purple),
          var(--cyan)
        );

      box-shadow:
        0 0 30px rgba(168,85,247,.55),
        0 0 55px rgba(34,211,238,.18);
    }

    .avatar img{
      width:100%;
      height:100%;

      object-fit:cover;
      object-position:center top;

      border-radius:50%;

      display:block;
    }

    h1{
      font-size:56px;
      font-weight:900;

      line-height:1;

      letter-spacing:-2px;

      margin-bottom:14px;

      background:
        linear-gradient(
          135deg,
          #ffffff,
          #d8b4fe,
          #67e8f9
        );

      -webkit-background-clip:text;
      background-clip:text;

      color:transparent;
    }

    .roles{
      font-size:13px;
      font-weight:700;

      text-transform:uppercase;

      letter-spacing:3px;

      color:#d8b4fe;

      margin-bottom:14px;
    }

    .location{
      font-size:15px;

      font-weight:600;

      color:#d6f4ff;

      margin-bottom:18px;

      text-shadow:
        0 0 12px rgba(34,211,238,.25);
    }

    .divider{
      width:72px;
      height:3px;

      margin:0 auto 22px;

      border-radius:999px;

      background:
        linear-gradient(
          90deg,
          var(--pink),
          var(--cyan)
        );
    }

    /* LINKS */

    .links{
      display:flex;
      flex-direction:column;

      gap:16px;
    }

    .link-btn{
      display:flex;
      justify-content:space-between;
      align-items:center;

      text-decoration:none;

      min-height:80px;

      padding:16px 18px;

      border-radius:22px;

      color:white;

      overflow:hidden;

      border:1px solid rgba(255,255,255,.14);

      background:rgba(255,255,255,.06);

      position:relative;

      transition:transform .25s ease;
    }

    .link-btn::before{
      content:"";

      position:absolute;
      inset:0;

      background:
        linear-gradient(
          120deg,
          transparent,
          rgba(255,255,255,.12),
          transparent
        );

      transform:translateX(-120%);

      transition:transform .7s ease;
    }

    .link-btn:hover::before{
      transform:translateX(120%);
    }

    .link-btn:hover{
      transform:
        translateY(-4px)
        scale(1.015);
    }

    .instagram{
      box-shadow:
        inset 0 0 0 1px rgba(255,79,216,.35),
        0 0 28px rgba(255,79,216,.12);
    }

    .facebook{
      box-shadow:
        inset 0 0 0 1px rgba(24,119,242,.38),
        0 0 28px rgba(24,119,242,.12);
    }

    .tiktok{
      box-shadow:
        inset 0 0 0 1px rgba(34,211,238,.35),
        0 0 28px rgba(34,211,238,.10);
    }

    .youtube{
      box-shadow:
        inset 0 0 0 1px rgba(255,59,48,.35),
        0 0 28px rgba(255,59,48,.10);
    }

    .whatsapp{
      box-shadow:
        inset 0 0 0 1px rgba(37,211,102,.35),
        0 0 28px rgba(37,211,102,.12);
    }

    .left{
      display:flex;
      align-items:center;

      gap:15px;
    }

    .icon{
      width:48px;
      height:48px;

      border-radius:15px;

      display:grid;
      place-items:center;

      font-weight:900;
      font-size:15px;

      color:white;
    }

    .ig{
      background:
        linear-gradient(
          135deg,
          #833ab4,
          #fd1d1d,
          #fcb045
        );
    }

    .fb{
      background:#1877f2;
      font-size:24px;
    }

    .tt{
      background:#050505;
    }

    .yt{
      background:#ff0000;
    }

    .wa{
      background:#25d366;
    }

    .platform{
      font-size:18px;
      font-weight:800;

      margin-bottom:4px;
    }

    .handle{
      font-size:14px;

      color:rgba(255,255,255,.68);
    }

    .arrow{
      width:38px;
      height:38px;

      border-radius:50%;

      border:1px solid rgba(255,255,255,.24);

      display:grid;
      place-items:center;
    }

    /* BOTTOM TEXT */

    .quote-box{
      margin-top:24px;

      padding:24px 22px;

      border-radius:24px;

      text-align:center;

      font-size:18px;

      font-weight:700;

      line-height:1.6;

      color:white;

      background:rgba(255,255,255,.05);

      border:1px solid rgba(255,255,255,.12);

      box-shadow:
        0 0 30px rgba(168,85,247,.10);
    }

    .quote-mark{
      display:block;

      font-size:32px;

      margin-bottom:8px;
    }

    footer{
      margin-top:22px;

      text-align:center;

      color:rgba(255,255,255,.52);

      font-size:13px;
    }

    /* MOBILE */

    @media(max-width:480px){

      body{
        padding:14px;
        align-items:flex-start;
      }

      .card{
        padding:22px 18px 28px;
        border-radius:30px;
      }

      .top-actions{
        margin-bottom:24px;
        padding:8px 10px;
        gap:8px;
      }

      .top-btn{
        min-height:44px;
        font-size:14px;
      }

      .top-btn span{
        font-size:18px;
      }

      .avatar{
        width:136px;
        height:136px;
      }

      h1{
        font-size:48px;
      }

      .roles{
        font-size:11px;
        letter-spacing:2px;
      }

      .location{
        font-size:14px;
      }

      .link-btn{
        min-height:76px;
        padding:15px;
      }

      .platform{
        font-size:16px;
      }

      .handle{
        font-size:13px;
      }

      .icon{
        width:44px;
        height:44px;
      }

    }

  </style>

</head>

<body>

    <!-- BOTTOM -->

    <div class="quote-box">

</html>
